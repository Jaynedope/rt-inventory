<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a2e1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RT Inventory">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>RT Inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar" id="topbar">
  <button class="iconbtn" id="backBtn" aria-label="Back" hidden>&#8249;</button>
  <h1 id="title">RT Inventory</h1>
  <button class="iconbtn" id="syncBtn" aria-label="Sync and backup">&#8645;<span class="badge" id="syncBadge" hidden></span></button>
</header>
<main id="view" tabindex="-1"></main>
<button class="fab" id="addBtn" aria-label="Add item" hidden>+</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="dataFile" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
