name: Build and publish to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site (decode icons)
        run: |
          mkdir -p _site/icons
          cp index.html app.js styles.css manifest.webmanifest sw.js .nojekyll _site/
          for f in icons/*.b64; do base64 -d "$f" > "_site/icons/$(basename "$f" .b64)"; done
          file _site/icons/*
      - name: Push _site to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
